name: Docker Image CI

on:
  push:
    branches: '**'
    tags: 'v*'
  pull_request:
    branches: [ main ]
  # Release + manual triggers are NOT subject to a tagged commit's [skip ci], so
  # the versioned image (e.g. :3.3, the tag prod pulls) always rebuilds on a
  # release. Version tags land on the task-battery "[skip ci]" commit on main, so
  # a plain tag push would skip this build — publish a GitHub Release (or run the
  # workflow manually on the tag) to force it.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: virtualflybrain/vfbchat
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    # The version the image reports at /api/version and sends as its User-Agent.
    # Only set for a real release: metadata-action's `version` output is the
    # branch name on a branch push, and "main" is not a version. Empty falls
    # through to package.json, which is the existing behaviour.
    - name: Resolve app version
      id: appver
      run: |
        if [ "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}" = "true" ]; then
          echo "value=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=" >> "$GITHUB_OUTPUT"
        fi

    # A release must not be able to describe itself as the wrong version.
    # v4.2.3 shipped with package.json reading 4.2.2 and reported itself as
    # 4.2.2 while being entirely correct — indistinguishable from a failed
    # rollout. The image is forced from the tag above; this fails the build when
    # the repo disagrees, so the next missed bump is caught here rather than
    # from outside an hour later.
    - name: Release tag must match package.json
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      run: |
        pkg=$(node -p "require('./package.json').version")
        tag="${{ steps.meta.outputs.version }}"
        if [ "$pkg" != "$tag" ]; then
          echo "::error::package.json is $pkg but the release tag is $tag. Bump package.json and package-lock.json."
          exit 1
        fi
        echo "package.json and the release tag agree at $pkg" >> "$GITHUB_STEP_SUMMARY"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.appver.outputs.value }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
