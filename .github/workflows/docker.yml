name: Docker Image CI

on:
  push:
    branches: '**'
    tags: 'v*'
  pull_request:
    branches: [ main ]
  # Release + manual triggers are NOT subject to a tagged commit's [skip ci], so
  # the versioned image (e.g. :3.3, the tag prod pulls) always rebuilds on a
  # release. Version tags land on the task-battery "[skip ci]" commit on main, so
  # a plain tag push would skip this build — publish a GitHub Release (or run the
  # workflow manually on the tag) to force it.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: virtualflybrain/vfbchat
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max